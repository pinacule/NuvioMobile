# Nuvio self-hosted sync backend — slim stack.
#
# Five containers:
#   db      Postgres (supabase/postgres image: ships auth.users + the
#           anon/authenticated/service_role roles GoTrue and PostgREST need)
#   migrate One-shot: applies ./migrations/*.sql on every boot (idempotent)
#   rest    PostgREST — REST API over the public schema at /rest/v1
#   auth    GoTrue    — email+password auth at /auth/v1
#   gateway Built from ./gateway — public entry point on :8080; serves
#           /.well-known/nuvio, proxies /rest/v1 and /auth/v1, and implements
#           /functions/v1/{delete-account,tv-logins-exchange} and /link.
#
# First run: copy .env.example -> .env and fill in values:
#   python3 scripts/gen-keys.py > .env
#   # then set NUVIO_BACKEND_URL to your public URL
#   docker compose up -d --build

services:
  db:
    image: supabase/postgres:15.19.0.004
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # POSTGRES_DB defaults to postgres; keep it.
    volumes:
      - db-data:/var/lib/postgresql/data
    # NOTE: migrations are NOT mounted to /docker-entrypoint-initdb.d here.
    # That would hide the image's own init scripts, and initdb.d only runs on
    # a fresh volume anyway. The `migrate` service below applies
    # ./migrations/*.sql on every `docker compose up`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot: applies ./migrations/*.sql in order, every time the stack
  # comes up (idempotent: IF NOT EXISTS / CREATE OR REPLACE). Fails the
  # deploy if any migration errors (ON_ERROR_STOP=1).
  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    command: >
      sh -c 'for f in /migrations/*.sql; do echo "== applying $$f"; psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$$f" || exit 1; done; echo "migrations done"'
    restart: "no"

  rest:
    image: postgrest/postgrest:v16.4
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SITE_URL: ${NUVIO_BACKEND_URL}
      # Email signups are auto-confirmed; no SMTP needed for basic use.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # To send real confirmation/reset emails, uncomment and fill in:
      # GOTRUE_SMTP_HOST: ""
      # GOTRUE_SMTP_PORT: "587"
      # GOTRUE_SMTP_USER: ""
      # GOTRUE_SMTP_PASS: ""
      # GOTRUE_SMTP_ADMIN_EMAIL: ""
      # GOTRUE_MAILER_AUTOCONFIRM: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      NUVIO_BACKEND_URL: ${NUVIO_BACKEND_URL}
      NUVIO_PUBLISHABLE_KEY: ${ANON_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      REST_URL: http://rest:3000
      AUTH_URL: http://auth:9999
    ports:
      - "8080:8080"
    depends_on:
      rest:
        condition: service_started
      auth:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
